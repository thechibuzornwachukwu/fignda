<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Traces</title>
<style>html, body { margin: 0; background: #f3ead9; } svg { display: block; }</style>
</head>
<body>
<!--
  Small drawings of traces, for "Which came first": traces lie on top of each other, and the one on top was made
  last. 4 tiles, each a close-up the size of a hand, each answering 1 question of order:
  1. Prints on the boards: a dry, dusty print, and a wet, muddy one stepped over it. The wet one is on top.
  2. A table top: an old cup ring under a layer of dust, and a new ring that cut through the dust. The new ring is last.
  3. The stage edge: a scratch, and wax dripped over it. The wax filled the scratch, so the scratch came first.
  4. A sign board: masking tape, and paint brushed over its edge. The paint ridges on the tape, so the tape came first.
  Same visual contract as the-hall.html.
-->
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <clipPath id="t1"><rect x="40" y="40" width="540" height="390" rx="18"/></clipPath>
    <clipPath id="t2"><rect x="620" y="40" width="540" height="390" rx="18"/></clipPath>
    <clipPath id="t3"><rect x="40" y="470" width="540" height="390" rx="18"/></clipPath>
    <clipPath id="t4"><rect x="620" y="470" width="540" height="390" rx="18"/></clipPath>
    <!-- A shoe print: sole and heel, toes up -->
    <g id="sole"><path d="M0,-70 C34,-70 40,-30 34,0 C30,24 -30,24 -34,0 C-40,-30 -34,-70 0,-70 Z"/><path d="M-26,40 L26,40 L24,78 L-24,78 Z"/></g>
  </defs>
  <g stroke="#2a2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">

    <!-- 1. Prints on the boards -->
    <g clip-path="url(#t1)">
      <rect x="40" y="40" width="540" height="390" fill="#d6be96"/>
      <g stroke="#a88b62" stroke-width="2"><line x1="40" y1="140" x2="580" y2="140"/><line x1="40" y1="240" x2="580" y2="240"/><line x1="40" y1="340" x2="580" y2="340"/><line x1="220" y1="40" x2="220" y2="140"/><line x1="420" y1="240" x2="420" y2="340"/></g>
      <!-- dry and dusty, first -->
      <g transform="translate(280 240) rotate(-10) scale(1.7)" fill="#efe4cf" stroke="#c3a87c" stroke-width="2"><use href="#sole"/></g>
      <!-- wet and muddy, stepped over it -->
      <g transform="translate(330 250) rotate(14) scale(1.7)" fill="#8a6a4a" stroke="none"><use href="#sole"/></g>
      <g fill="#8a6a4a" stroke="none"><circle cx="410" cy="330" r="5"/><circle cx="296" cy="348" r="4"/><circle cx="388" cy="150" r="3"/></g>
    </g>
    <rect x="40" y="40" width="540" height="390" rx="18" fill="none"/>

    <!-- 2. Dust and cup rings on a table top -->
    <g clip-path="url(#t2)">
      <rect x="620" y="40" width="540" height="390" fill="#7a5236"/>
      <g stroke="#6a4630" stroke-width="2" fill="none"><path d="M620,120 C780,110 960,140 1160,118"/><path d="M620,300 C800,290 960,320 1160,296"/></g>
      <!-- the old ring, first -->
      <circle cx="800" cy="220" r="70" fill="none" stroke="#a17a52" stroke-width="12"/>
      <!-- dust, over everything that was there -->
      <g fill="#e3d6bd" stroke="none" opacity="0.9">
        <circle cx="660" cy="80" r="3"/><circle cx="700" cy="140" r="2"/><circle cx="740" cy="90" r="3"/><circle cx="790" cy="160" r="2"/><circle cx="760" cy="240" r="3"/><circle cx="820" cy="280" r="2"/><circle cx="850" cy="200" r="3"/><circle cx="870" cy="150" r="2"/><circle cx="740" cy="300" r="3"/><circle cx="690" cy="260" r="2"/><circle cx="680" cy="360" r="3"/><circle cx="760" cy="380" r="2"/><circle cx="830" cy="350" r="3"/><circle cx="900" cy="390" r="2"/><circle cx="960" cy="70" r="3"/><circle cx="1010" cy="120" r="2"/><circle cx="1090" cy="90" r="3"/><circle cx="1130" cy="160" r="2"/><circle cx="1110" cy="260" r="3"/><circle cx="1140" cy="340" r="2"/><circle cx="1060" cy="400" r="3"/><circle cx="980" cy="410" r="2"/><circle cx="800" cy="70" r="2"/><circle cx="910" cy="110" r="3"/><circle cx="780" cy="215" r="2"/><circle cx="815" cy="235" r="3"/><circle cx="730" cy="200" r="2"/><circle cx="870" cy="250" r="3"/>
      </g>
      <!-- the new ring, through the dust: clean wood inside its line -->
      <circle cx="1010" cy="250" r="66" fill="none" stroke="#5a3d2a" stroke-width="14"/>
    </g>
    <rect x="620" y="40" width="540" height="390" rx="18" fill="none"/>

    <!-- 3. A scratch on the stage edge, and wax over it -->
    <g clip-path="url(#t3)">
      <rect x="40" y="470" width="540" height="390" fill="#7a5236"/>
      <rect x="40" y="470" width="540" height="70" fill="#5a3d2a"/>
      <!-- the scratch, first -->
      <path d="M90,700 L300,640 L520,690" fill="none" stroke="#c99a6a" stroke-width="5"/>
      <!-- the wax, over it, and into it -->
      <path d="M250,540 C250,600 236,640 252,700 C262,740 300,742 306,700 C318,646 300,600 300,540 Z" fill="#fbfaf6"/>
      <ellipse cx="275" cy="540" rx="44" ry="10" fill="#fbfaf6"/>
      <path d="M268,652 L292,648" stroke="#e3d6bd" stroke-width="4"/>
      <circle cx="380" cy="770" r="12" fill="#fbfaf6"/>
    </g>
    <rect x="40" y="470" width="540" height="390" rx="18" fill="none"/>

    <!-- 4. Tape on a sign board, and paint brushed over its edge -->
    <g clip-path="url(#t4)">
      <rect x="620" y="470" width="540" height="390" fill="#efe4cf"/>
      <!-- the old lettering, under -->
      <path d="M700,560 L700,700 M700,560 L760,560 M700,630 L750,630" fill="none" stroke="#8fa37e" stroke-width="16"/>
      <!-- the tape, first -->
      <rect x="640" y="720" width="500" height="54" fill="#d0a65a" opacity="0.9" transform="rotate(-3 890 747)"/>
      <!-- the paint, brushed over the board and up onto the tape -->
      <path d="M800,520 C900,500 1020,520 1140,510 L1140,742 C1060,734 980,748 900,740 C860,736 820,744 800,738 Z" fill="#b5573c"/>
      <path d="M810,736 C880,744 960,732 1040,740 C1080,744 1110,736 1138,740" fill="none" stroke="#8f3f2a" stroke-width="6"/>
      <path d="M840,600 C900,590 980,604 1100,592 M840,660 C920,652 1000,668 1100,656" fill="none" stroke="#c46a4e" stroke-width="3"/>
    </g>
    <rect x="620" y="470" width="540" height="390" rx="18" fill="none"/>
  </g>
</svg>
</body>
</html>
