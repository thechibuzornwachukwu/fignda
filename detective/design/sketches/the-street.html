<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map of Lantern Row</title>
<style>html, body { margin: 0; background: #f3ead9; } svg { display: block; }</style>
</head>
<body>
<!--
  Lantern Row from above (design/WORLD.md): the map every case is pinned to. The top of the street (the bus stop) is
  on the left, the market row on the right. Top side: the alley, the hall with the yard behind it, the bakery, the
  sale room. Bottom side: the bus stop and the tea kiosk, 2 plane trees, the library and its lime tree, the houses.
  The road leaves at each edge, toward the places too far to walk to.
  Same visual contract as the other sketches: cream ground, 1 ink line with a hand wobble, flat muted fills, no
  words, no lime. Every place in src/engine/world.ts is marked by an invisible point (data-place) at its spot, and
  every shape a season dresses carries data-anchor. A test keeps both the same as world.ts.
-->
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <pattern id="cobbles" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#ddd0b8"/>
      <circle cx="5" cy="5" r="3.2" fill="#cbbb9d"/>
      <circle cx="14" cy="13" r="3.2" fill="#cbbb9d"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#f3ead9"/>

  <g stroke="#2a2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">
    <!-- The street: cobbled at the top, tarmac below the hall, opening into the market square -->
    <rect x="0" y="430" width="470" height="80" fill="url(#cobbles)" stroke="none"/>
    <rect x="470" y="430" width="410" height="80" fill="#d9cdb6" stroke="none"/>
    <rect x="880" y="340" width="280" height="260" fill="#e3d6bd" stroke="none" data-anchor="market-square"/>
    <rect x="1160" y="430" width="40" height="80" fill="#d9cdb6" stroke="none"/>
    <path d="M0,430 L880,430 L880,340 L1160,340 L1160,430 L1200,430" fill="none"/>
    <path d="M0,510 L880,510 L880,600 L1160,600 L1160,510 L1200,510" fill="none"/>
    <!-- The road leaving at each edge -->
    <path d="M40,456 L18,470 L40,484" fill="none" stroke-width="4"/>
    <path d="M1160,441 L1182,455 L1160,469" fill="none" stroke-width="4"/>
    <path d="M1160,476 L1182,490 L1160,504" fill="none" stroke-width="4"/>

    <!-- The alley: up the left side of the hall and along its back wall, to the yard. Unlit -->
    <path d="M140,430 L140,120 L470,120 L470,150 L180,150 L180,430 Z" fill="#c8b998"/>
    <!-- The yard behind, a car park on Friday nights, and the drive down to the gate -->
    <rect x="470" y="40" width="400" height="110" fill="#e3d6bd"/>
    <g stroke-width="2"><path d="M530,60 L530,130 M590,60 L590,130 M650,60 L650,130 M710,60 L710,130 M770,60 L770,130 M830,60 L830,130"/></g>
    <rect x="470" y="150" width="50" height="280" fill="#e3d6bd"/>
    <circle cx="470" cy="424" r="6" fill="#7a5236"/>
    <circle cx="520" cy="424" r="6" fill="#7a5236"/>
    <path d="M476,424 L514,424" stroke-width="4"/>

    <!-- The hall: brick, 1 storey, its clock facing the street -->
    <rect x="180" y="150" width="290" height="260" fill="#b5573c" data-anchor="roof-hall"/>
    <path d="M180,150 L260,280 L390,280 L470,150 M180,410 L260,280 M390,280 L470,410" fill="none" stroke-width="2"/>
    <circle cx="325" cy="395" r="13" fill="#f3ead9"/>
    <path d="M325,395 L325,386 M325,395 L332,398" fill="none" stroke-width="2"/>
    <rect x="300" y="404" width="50" height="10" fill="#7a5236" data-anchor="door-hall"/>
    <rect x="230" y="398" width="40" height="22" fill="#d0a65a"/>
    <rect x="174" y="290" width="10" height="30" fill="#7a5236"/>
    <rect x="440" y="372" width="28" height="36" fill="#d0a65a"/>

    <!-- The bakery, the art room upstairs, its chimney and window boxes -->
    <rect x="530" y="170" width="160" height="240" fill="#c98b4e" data-anchor="roof-bakery"/>
    <path d="M530,290 L690,290" fill="none" stroke-width="2"/>
    <rect x="640" y="182" width="22" height="30" fill="#7a5236"/>
    <rect x="590" y="404" width="40" height="10" fill="#7a5236" data-anchor="door-bakery"/>
    <rect x="545" y="396" width="34" height="9" fill="#8a9a6b"/>
    <rect x="642" y="396" width="34" height="9" fill="#8a9a6b"/>

    <!-- The sale room -->
    <rect x="700" y="180" width="170" height="230" fill="#8fa3ad" data-anchor="roof-sale-room"/>
    <path d="M700,180 L785,240 L870,180 M785,240 L785,410" fill="none" stroke-width="2"/>
    <rect x="765" y="404" width="40" height="10" fill="#7a5236" data-anchor="door-sale-room"/>

    <!-- The bus stop and its timetable post, the tea kiosk beside it -->
    <rect x="60" y="525" width="100" height="34" fill="#7a5236"/>
    <circle cx="172" cy="528" r="5" fill="#d0a65a"/>
    <rect x="180" y="525" width="44" height="44" fill="#b5573c"/>

    <!-- 2 plane trees on the pavement -->
    <circle cx="275" cy="560" r="26" fill="#9aa57a" data-anchor="tree-plane-1"/>
    <circle cx="335" cy="560" r="26" fill="#9aa57a" data-anchor="tree-plane-2"/>

    <!-- The library, and the lime tree outside it, the oldest thing on the street -->
    <rect x="380" y="530" width="200" height="230" fill="#7f8d63" data-anchor="roof-library"/>
    <path d="M380,645 L580,645" fill="none" stroke-width="2"/>
    <rect x="455" y="524" width="50" height="10" fill="#7a5236" data-anchor="door-library"/>
    <circle cx="625" cy="572" r="42" fill="#a9b37f" data-anchor="tree-lime"/>

    <!-- The houses, terraced -->
    <g data-anchor="roof-houses">
      <rect x="680" y="530" width="45" height="170" fill="#c9b48f"/>
      <rect x="725" y="530" width="45" height="170" fill="#d3bf9a"/>
      <rect x="770" y="530" width="45" height="170" fill="#c9b48f"/>
      <rect x="815" y="530" width="45" height="170" fill="#d3bf9a"/>
    </g>

    <!-- The market row: 4 stalls a side under awnings, and the watchman's hut at the bottom -->
    <g stroke-width="2.5">
      <rect x="900" y="350" width="55" height="60" fill="#b5573c" data-anchor="awning-1"/>
      <rect x="965" y="350" width="55" height="60" fill="#8a9a6b" data-anchor="awning-2"/>
      <rect x="1030" y="350" width="55" height="60" fill="#d0a65a" data-anchor="awning-3"/>
      <rect x="1095" y="350" width="55" height="60" fill="#8fa3ad" data-anchor="awning-4"/>
      <rect x="900" y="530" width="55" height="60" fill="#d0a65a" data-anchor="awning-5"/>
      <rect x="965" y="530" width="55" height="60" fill="#8fa3ad" data-anchor="awning-6"/>
      <rect x="1030" y="530" width="55" height="60" fill="#b5573c" data-anchor="awning-7"/>
      <rect x="1095" y="530" width="55" height="60" fill="#8a9a6b" data-anchor="awning-8"/>
      <path d="M918,350 L918,410 M936,350 L936,410 M983,350 L983,410 M1001,350 L1001,410 M1048,350 L1048,410 M1066,350 L1066,410 M1113,350 L1113,410 M1131,350 L1131,410" fill="none" stroke-width="1.5"/>
      <path d="M918,530 L918,590 M936,530 L936,590 M983,530 L983,590 M1001,530 L1001,590 M1048,530 L1048,590 M1066,530 L1066,590 M1113,530 L1113,590 M1131,530 L1131,590" fill="none" stroke-width="1.5"/>
    </g>
    <rect x="1110" y="620" width="46" height="46" fill="#7a5236"/>

    <!-- The lamps the street is named for, on both kerbs -->
    <g fill="#d0a65a" stroke-width="2.5">
      <circle cx="100" cy="424" r="7" data-anchor="lamp-1"/>
      <circle cx="420" cy="424" r="7" data-anchor="lamp-2"/>
      <circle cx="700" cy="424" r="7" data-anchor="lamp-3"/>
      <circle cx="880" cy="334" r="7" data-anchor="lamp-4"/>
      <circle cx="240" cy="516" r="7" data-anchor="lamp-5"/>
      <circle cx="600" cy="516" r="7" data-anchor="lamp-6"/>
      <circle cx="880" cy="606" r="7" data-anchor="lamp-7"/>
      <circle cx="1160" cy="606" r="7" data-anchor="lamp-8"/>
    </g>
  </g>

  <!-- Open sky over the rooftops, where a season puts what flies: bats, lanterns -->
  <g fill="none" stroke="none">
    <rect x="200" y="20" width="160" height="90" data-anchor="sky-1"/>
    <rect x="900" y="80" width="200" height="180" data-anchor="sky-2"/>
    <rect x="40" y="600" width="300" height="160" data-anchor="sky-3"/>
  </g>

  <!-- Where each place is, for the pins and the routes. Invisible -->
  <g fill="none" stroke="none">
    <circle data-place="street" cx="560" cy="470" r="1"/>
    <circle data-place="bus-stop" cx="110" cy="542" r="1"/>
    <circle data-place="tea-kiosk" cx="202" cy="547" r="1"/>
    <circle data-place="hall" cx="330" cy="250" r="1"/>
    <circle data-place="store-room" cx="225" cy="190" r="1"/>
    <circle data-place="committee-room" cx="420" cy="195" r="1"/>
    <circle data-place="caretaker-desk" cx="454" cy="390" r="1"/>
    <circle data-place="side-door" cx="180" cy="305" r="1"/>
    <circle data-place="notice-board" cx="250" cy="409" r="1"/>
    <circle data-place="yard" cx="670" cy="95" r="1"/>
    <circle data-place="alley" cx="160" cy="330" r="1"/>
    <circle data-place="library" cx="480" cy="645" r="1"/>
    <circle data-place="bakery" cx="610" cy="300" r="1"/>
    <circle data-place="art-room" cx="610" cy="220" r="1"/>
    <circle data-place="sale-room" cx="785" cy="295" r="1"/>
    <circle data-place="houses" cx="760" cy="615" r="1"/>
    <circle data-place="market-row" cx="1020" cy="470" r="1"/>
    <circle data-place="watchman-hut" cx="1133" cy="643" r="1"/>
    <circle data-place="depot" cx="24" cy="470" r="1"/>
    <circle data-place="night-stall" cx="1176" cy="455" r="1"/>
    <circle data-place="secretary-house" cx="1176" cy="490" r="1"/>
  </g>
</svg>
</body>
</html>
