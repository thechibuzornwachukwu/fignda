<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The hall in layers</title>
<style>html, body { margin: 0; background: #f3ead9; } svg { display: block; width: 100%; max-width: 100%; height: auto; }</style>
</head>
<body>
<!--
  The hall, close in, for "Look under it": things are hidden where nobody dusts. Each thing that lifts, slides or
  opens is drawn moved, with what was behind it showing. Same visual contract as the-hall.html.
  Layers (each a thing moved, and what it showed):
  - the notice board swung off its nail: an envelope taped to the wall behind it
  - the rug's corner turned back: a cloakroom ticket on the boards
  - the sideboard's lower drawer pulled right out: a tin of candle stubs and a box of matches in the space behind it
-->
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
  <g stroke="#2a2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">
    <!-- Wall and floor, close in -->
    <rect x="0" y="0" width="1200" height="600" fill="#efe4cf"/>
    <rect x="0" y="600" width="1200" height="300" fill="#d6be96"/>
    <g stroke="#a88b62" stroke-width="2">
      <line x1="0" y1="680" x2="1200" y2="680"/><line x1="0" y1="770" x2="1200" y2="770"/><line x1="0" y1="860" x2="1200" y2="860"/>
      <line x1="300" y1="600" x2="300" y2="680"/><line x1="760" y1="680" x2="760" y2="770"/><line x1="520" y1="770" x2="520" y2="860"/>
    </g>
    <line x1="0" y1="580" x2="1200" y2="580" stroke-width="2"/>

    <!-- Where the notice board hung: a cleaner patch, the nail, and the envelope taped to the wall -->
    <rect x="130" y="120" width="290" height="220" fill="#f6eedd" stroke-dasharray="10 10" stroke-width="2"/>
    <circle cx="275" cy="132" r="5" fill="#2a2622"/>
    <rect x="270" y="176" width="130" height="86" fill="#fbfaf6"/>
    <path d="M270,176 L335,224 L400,176" fill="none" stroke-width="2"/>
    <rect x="256" y="166" width="44" height="18" fill="#d0a65a" opacity="0.85" transform="rotate(-24 278 175)" stroke="none"/>
    <rect x="372" y="248" width="44" height="18" fill="#d0a65a" opacity="0.85" transform="rotate(-24 394 257)" stroke="none"/>
    <!-- The board itself, swung down and out on its bottom corner -->
    <g transform="translate(90 60) rotate(-30 130 340) scale(0.8)">
      <rect x="130" y="120" width="290" height="220" fill="#b98a5a"/>
      <rect x="150" y="138" width="80" height="96" fill="#f3ead9" transform="rotate(-4 190 186)"/>
      <rect x="250" y="146" width="140" height="70" fill="#fbfaf6" transform="rotate(3 320 181)"/>
      <rect x="240" y="236" width="100" height="70" fill="#f3ead9" transform="rotate(-2 290 271)"/>
      <circle cx="190" cy="144" r="5" fill="#c2462f"/><circle cx="320" cy="150" r="5" fill="#c2462f"/>
    </g>

    <!-- The sideboard -->
    <rect x="640" y="330" width="460" height="290" fill="#7a5236"/>
    <rect x="626" y="316" width="488" height="22" fill="#5a3d2a"/>
    <rect x="664" y="356" width="412" height="80" fill="#8b6040"/>
    <circle cx="870" cy="396" r="7" fill="#d0a65a"/>
    <!-- The lower drawer's empty slot, dark, with what was hidden behind it -->
    <rect x="664" y="456" width="412" height="120" fill="#2e2620"/>
    <rect x="860" y="500" width="72" height="54" rx="6" fill="#7d93a8"/>
    <rect x="874" y="474" width="10" height="30" fill="#fbfaf6"/><rect x="892" y="482" width="10" height="22" fill="#fbfaf6"/><rect x="910" y="470" width="10" height="34" fill="#fbfaf6"/>
    <rect x="950" y="530" width="64" height="26" fill="#b5573c"/>
    <rect x="950" y="530" width="20" height="26" fill="#d0a65a"/>
    <!-- The drawer itself, pulled right out and set on the floor -->
    <polygon points="640,700 1000,700 1050,640 690,640" fill="#a17a52"/>
    <rect x="640" y="700" width="360" height="96" fill="#8b6040"/>
    <circle cx="820" cy="748" r="7" fill="#d0a65a"/>
    <path d="M700,664 L760,664 M780,660 L860,660 M880,666 L960,666" stroke-width="2"/>

    <!-- The rug, its near corner turned back, and the ticket that lay under it -->
    <polygon points="90,660 590,660 620,880 210,880" fill="#b5573c"/>
    <polygon points="110,674 570,674 596,866 222,866" fill="none" stroke="#8fa37e" stroke-width="8"/>
    <!-- the boards where the corner was -->
    <polygon points="60,880 210,880 150,760" fill="#d6be96" stroke="none"/>
    <!-- the turned corner, its underside showing -->
    <polygon points="150,760 210,880 300,770" fill="#e3d6bd"/>
    <line x1="150" y1="760" x2="210" y2="880" stroke-dasharray="8 8" stroke-width="2"/>
    <!-- the ticket -->
    <g transform="rotate(-9 110 830)">
      <rect x="70" y="806" width="80" height="46" fill="#fbfaf6"/>
      <circle cx="84" cy="829" r="5" fill="#d6be96"/>
      <text x="102" y="839" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2a2622" stroke="none">47</text>
    </g>
  </g>
</svg>
</body>
</html>
