<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The sale room</title>
<style>html, body { margin: 0; background: #f3ead9; } svg { display: block; width: 100%; max-width: 100%; height: auto; }</style>
</head>
<body>
<!--
  The sale room, case 7 (The other spoon): a second Long Spoon turns up for sale, with all 20 names on it. The new
  method is the torn page. Same visual contract as the-hall.html.
  Evidence (locked): the spoon on its cloth, with 20 burns on the handle; its lot ticket; the sale book open on the
  lectern with the stub of a page torn out; the torn half page in the bin, its edge matching the stub; an envelope
  with a stamp on the lectern (the list of names came by post).
  Ordinary things (swappable): the shelves of lots, the boxes, the lamp, the clock, the chairs, the bell.
-->
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
  </defs>
  <g stroke="#2a2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">
    <!-- Room -->
    <polygon points="0,0 1200,0 1060,90 140,90" fill="#e3d6bd"/>
    <polygon points="0,0 140,90 140,600 0,700" fill="#e9dcc3"/>
    <polygon points="1200,0 1060,90 1060,600 1200,700" fill="#e9dcc3"/>
    <rect x="140" y="90" width="920" height="510" fill="#efe4cf"/>
    <polygon points="0,700 140,600 1060,600 1200,700 1200,900 0,900" fill="#b98a5a"/>
    <g stroke="#9a7048" stroke-width="2"><line x1="0" y1="780" x2="1200" y2="780"/><line x1="70" y1="650" x2="1130" y2="650"/></g>

    <!-- Shelves of lots on the back wall -->
    <rect x="180" y="140" width="380" height="300" fill="#7a5236"/>
    <g fill="#a17a52"><rect x="190" y="226" width="360" height="10"/><rect x="190" y="326" width="360" height="10"/></g>
    <rect x="204" y="176" width="44" height="50" fill="#7d93a8"/><path d="M270,226 L300,170 L330,226 Z" fill="#8fa37e"/><rect x="350" y="186" width="70" height="40" fill="#d0a65a"/><circle cx="470" cy="204" r="22" fill="#fbfaf6"/>
    <rect x="210" y="282" width="80" height="44" fill="#b5573c"/><rect x="310" y="270" width="36" height="56" fill="#fbfaf6"/><rect x="366" y="290" width="90" height="36" fill="#5d7187"/><rect x="474" y="276" width="56" height="50" fill="#8fa37e"/>
    <rect x="216" y="376" width="120" height="50" fill="#d0a65a"/><rect x="356" y="384" width="60" height="42" fill="#7d93a8"/><circle cx="470" cy="402" r="24" fill="#b5573c"/>
    <!-- Clock and lamp -->
    <circle cx="660" cy="170" r="36" fill="#fbfaf6"/><line x1="660" y1="170" x2="660" y2="146"/><line x1="660" y1="170" x2="678" y2="178"/>
    <line x1="820" y1="90" x2="820" y2="170"/><path d="M780,210 L860,210 L840,170 L800,170 Z" fill="#d0a65a"/>
    <!-- Window, daytime -->
    <rect x="900" y="150" width="120" height="220" fill="#a8bccd"/><line x1="960" y1="150" x2="960" y2="370"/><line x1="900" y1="260" x2="1020" y2="260"/><rect x="890" y="370" width="140" height="12" fill="#efe4cf"/>

    <!-- The long table with its cloth, and the spoon on it -->
    <polygon points="230,520 830,520 880,580 180,580" fill="#8fa37e"/>
    <rect x="180" y="580" width="700" height="60" fill="#7c9069"/>
    <path d="M200,640 L200,720 M860,640 L860,720" stroke-width="6"/>
    <!-- the spoon, long as an arm -->
    <g transform="rotate(-4 520 548)">
      <ellipse cx="300" cy="548" rx="54" ry="22" fill="#c99a6a"/>
      <rect x="350" y="540" width="420" height="16" rx="8" fill="#c99a6a"/>
      <g stroke="#5a3d2a" stroke-width="2">
        <line x1="376" y1="542" x2="376" y2="554"/><line x1="394" y1="542" x2="394" y2="554"/><line x1="412" y1="542" x2="412" y2="554"/><line x1="430" y1="542" x2="430" y2="554"/><line x1="448" y1="542" x2="448" y2="554"/>
        <line x1="466" y1="542" x2="466" y2="554"/><line x1="484" y1="542" x2="484" y2="554"/><line x1="502" y1="542" x2="502" y2="554"/><line x1="520" y1="542" x2="520" y2="554"/><line x1="538" y1="542" x2="538" y2="554"/>
        <line x1="556" y1="542" x2="556" y2="554"/><line x1="574" y1="542" x2="574" y2="554"/><line x1="592" y1="542" x2="592" y2="554"/><line x1="610" y1="542" x2="610" y2="554"/><line x1="628" y1="542" x2="628" y2="554"/>
        <line x1="646" y1="542" x2="646" y2="554"/><line x1="664" y1="542" x2="664" y2="554"/><line x1="682" y1="542" x2="682" y2="554"/><line x1="700" y1="542" x2="700" y2="554"/><line x1="718" y1="542" x2="718" y2="554"/>
      </g>
    </g>
    <!-- its lot ticket, on a string -->
    <path d="M770,550 C790,560 800,580 812,590" fill="none" stroke-width="2"/>
    <rect x="796" y="586" width="56" height="34" fill="#fbfaf6" transform="rotate(12 824 603)"/>
    <text x="806" y="612" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2a2622" stroke="none" transform="rotate(12 824 603)">20</text>
    <!-- the bell -->
    <path d="M220,520 C220,500 250,500 250,520 Z" fill="#d0a65a"/><circle cx="235" cy="496" r="4" fill="#d0a65a"/>

    <!-- The lectern, the sale book with a page torn out, and the envelope -->
    <polygon points="930,470 1110,470 1080,560 960,560" fill="#7a5236"/>
    <rect x="1000" y="560" width="40" height="160" fill="#7a5236"/>
    <polygon points="950,478 1018,478 1018,546 966,546" fill="#fbfaf6"/>
    <polygon points="1022,478 1090,478 1074,546 1022,546" fill="#fbfaf6"/>
    <g stroke-width="2"><line x1="962" y1="494" x2="1008" y2="494"/><line x1="964" y1="508" x2="1008" y2="508"/><line x1="966" y1="522" x2="1008" y2="522"/></g>
    <!-- the stub where a page was torn, by the spine -->
    <path d="M1022,480 L1030,488 L1024,498 L1032,508 L1024,518 L1032,528 L1024,538 L1028,546" fill="none" stroke-width="2"/>
    <rect x="1050" y="430" width="70" height="44" fill="#efe4cf" transform="rotate(8 1085 452)"/>
    <path d="M1050,430 L1085,456 L1120,430" fill="none" stroke-width="2" transform="rotate(8 1085 452)"/>
    <rect x="1100" y="436" width="14" height="16" fill="#b5573c" stroke-width="2" transform="rotate(8 1085 452)"/>

    <!-- The bin, and the torn half page in it -->
    <path d="M60,760 L160,760 L148,880 L72,880 Z" fill="#5d7187"/>
    <g transform="rotate(-14 110 740)">
      <path d="M78,700 L140,700 L146,712 L138,722 L146,734 L138,746 L146,758 L140,770 L78,770 Z" fill="#fbfaf6"/>
      <g stroke-width="2"><line x1="88" y1="716" x2="128" y2="716"/><line x1="88" y1="730" x2="130" y2="730"/><line x1="88" y1="744" x2="124" y2="744"/></g>
    </g>

    <!-- Boxes of lots on the floor, and a chair -->
    <rect x="300" y="760" width="150" height="100" fill="#d0a65a"/><path d="M300,760 L340,730 L490,730 L450,760" fill="#e3c27a"/><path d="M450,760 L490,730 L490,830 L450,860 Z" fill="#b8924a"/>
    <rect x="520" y="790" width="110" height="80" fill="#c99a6a"/>
    <path d="M700,740 L770,740 L770,800 L700,800 Z M700,800 L690,880 M770,800 L780,880 M700,740 L700,660 L770,660 L770,740" fill="#7d93a8"/>
  </g>
</svg>
</body>
</html>
