<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The hall at night</title>
<style>
  html, body { margin: 0; background: #f3ead9; }
  svg { display: block; width: 100%; max-width: 100%; height: auto; }
</style>
</head>
<body>
<!--
  The hall behind the market, case 5 (The light in the hall), for "Sweep the room".
  Visual contract for every drawn room: warm cream ground, ink line in 1 weight with a slight hand wobble, flat
  muted fills (terracotta, sage, dusty blue, ochre, wood), even light, no gradient, no texture, no blur, no brass.
  Brass is kept for "found" and is never in the drawing itself.
  Evidence (locked, from the chapter): a torch on the piano lid, muddy prints from the side door to the piano,
  wax dripped on the stage edge, a key with no tag under a chair, 1 chair turned to the window, the window latch up.
  Ordinary things (swappable): chairs, books, a cup, the coat, the bucket and mop, the notice board, the clock.
-->
<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <clipPath id="floor"><polygon points="0,700 200,560 1000,560 1200,700 1200,900 0,900"/></clipPath>
    <!-- A folding chair, seen from behind, seat towards the stage. -->
    <g id="chair">
      <path d="M-34,-92 L34,-92 L34,-50 L-34,-50 Z" fill="#7d93a8"/>
      <path d="M-40,-46 L40,-46 L46,-30 L-46,-30 Z" fill="#6c8197"/>
      <path d="M-30,-92 L-38,0 M30,-92 L38,0 M-40,-30 L-24,0 M40,-30 L24,0" fill="none"/>
    </g>
  </defs>

  <g stroke="#2a2622" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">
    <!-- Room: ceiling, walls, floor -->
    <polygon points="0,0 1200,0 1000,120 200,120" fill="#e3d6bd"/>
    <polygon points="0,0 200,120 200,560 0,700" fill="#e9dcc3"/>
    <polygon points="1200,0 1000,120 1000,560 1200,700" fill="#e9dcc3"/>
    <rect x="200" y="120" width="800" height="440" fill="#efe4cf"/>
    <polygon points="0,700 200,560 1000,560 1200,700 1200,900 0,900" fill="#d6be96"/>
    <g clip-path="url(#floor)" stroke-width="2" stroke="#a88b62">
      <line x1="280" y1="560" x2="-142" y2="900"/><line x1="360" y1="560" x2="-11" y2="900"/>
      <line x1="440" y1="560" x2="193" y2="900"/><line x1="520" y1="560" x2="396" y2="900"/>
      <line x1="600" y1="560" x2="600" y2="900"/><line x1="680" y1="560" x2="804" y2="900"/>
      <line x1="760" y1="560" x2="1007" y2="900"/><line x1="840" y1="560" x2="1211" y2="900"/>
      <line x1="920" y1="560" x2="1414" y2="900"/>
      <line x1="0" y1="760" x2="1200" y2="760"/>
    </g>
    <!-- Skirting -->
    <line x1="200" y1="540" x2="1000" y2="540" stroke-width="2"/>

    <!-- The hall clock, high on the back wall (case 3) -->
    <circle cx="300" cy="190" r="40" fill="#fbfaf6"/>
    <line x1="300" y1="190" x2="300" y2="164"/>
    <line x1="300" y1="190" x2="320" y2="200"/>
    <circle cx="300" cy="190" r="3" fill="#2a2622"/>

    <!-- Notice board -->
    <rect x="240" y="300" width="150" height="104" fill="#b98a5a"/>
    <rect x="254" y="312" width="44" height="54" fill="#f3ead9" transform="rotate(-4 276 339)"/>
    <rect x="310" y="318" width="60" height="40" fill="#fbfaf6" transform="rotate(3 340 338)"/>
    <rect x="300" y="366" width="50" height="30" fill="#f3ead9" transform="rotate(-2 325 381)"/>
    <circle cx="276" cy="316" r="4" fill="#c2462f"/><circle cx="340" cy="322" r="4" fill="#c2462f"/>

    <!-- The stage, its curtains and the dark behind them -->
    <rect x="430" y="200" width="340" height="270" fill="#3a3029"/>
    <path d="M430,200 C450,300 420,400 452,470 L500,470 C480,380 520,280 500,200 Z" fill="#b5573c"/>
    <path d="M770,200 C750,300 780,400 748,470 L700,470 C720,380 680,280 700,200 Z" fill="#b5573c"/>
    <path d="M412,150 L788,150 L788,206 C730,224 670,190 600,212 C530,190 470,224 412,206 Z" fill="#9e4a33"/>
    <rect x="410" y="470" width="380" height="90" fill="#7a5236"/>
    <line x1="410" y1="470" x2="790" y2="470" stroke-width="4"/>
    <!-- Wax, dripped over the stage edge (evidence) -->
    <path d="M622,470 C622,486 618,494 624,500 C630,494 628,486 630,470 Z" fill="#fbfaf6" stroke-width="2"/>
    <path d="M640,470 C641,480 638,486 643,488 C648,485 646,478 646,470 Z" fill="#fbfaf6" stroke-width="2"/>
    <ellipse cx="634" cy="468" rx="18" ry="4" fill="#fbfaf6" stroke-width="2"/>

    <!-- The window: 2 sashes, night outside. The latch on the meeting rail is up, and the top sash has dropped a finger (evidence) -->
    <rect x="818" y="182" width="154" height="266" fill="#e3d6bd"/>
    <rect x="830" y="194" width="130" height="112" fill="#4d6176"/>
    <rect x="830" y="318" width="130" height="118" fill="#5d7187"/>
    <line x1="895" y1="194" x2="895" y2="306"/><line x1="830" y1="250" x2="960" y2="250"/>
    <line x1="895" y1="318" x2="895" y2="436"/><line x1="830" y1="377" x2="960" y2="377"/>
    <rect x="830" y="306" width="130" height="12" fill="#efe4cf"/>
    <rect x="806" y="448" width="178" height="12" fill="#efe4cf"/>
    <path d="M888,306 l6,-14 l10,0" fill="none" stroke-width="3"/>
    <!-- The side door on the left wall, ajar -->
    <polygon points="60,250 150,282 150,602 60,654" fill="#3a3029"/>
    <polygon points="150,282 196,268 196,592 150,602" fill="#8fa37e"/>
    <circle cx="186" cy="440" r="4" fill="#2a2622"/>

    <!-- Muddy prints from the door to the piano (evidence) -->
    <g fill="#8a6a4a" stroke="none">
      <ellipse cx="193" cy="640.0" rx="7.2" ry="5.0"/><ellipse cx="182" cy="640.0" rx="3.6" ry="4.0"/><ellipse cx="239" cy="652.0" rx="7.2" ry="5.0"/><ellipse cx="228" cy="652.0" rx="3.6" ry="4.0"/>
      <ellipse cx="303" cy="640.0" rx="8.0" ry="5.0"/><ellipse cx="291" cy="640.0" rx="4.0" ry="4.0"/><ellipse cx="355" cy="654.0" rx="8.0" ry="5.0"/><ellipse cx="343" cy="654.0" rx="4.0" ry="4.0"/>
      <ellipse cx="423" cy="642.0" rx="8.0" ry="6.0"/><ellipse cx="411" cy="642.0" rx="4.0" ry="4.8"/><ellipse cx="481" cy="656.0" rx="8.0" ry="6.0"/><ellipse cx="469" cy="656.0" rx="4.0" ry="4.8"/>
      <ellipse cx="551" cy="644.0" rx="8.8" ry="6.0"/><ellipse cx="538" cy="644.0" rx="4.4" ry="4.8"/><ellipse cx="613" cy="658.0" rx="8.8" ry="6.0"/><ellipse cx="600" cy="658.0" rx="4.4" ry="4.8"/>
      <ellipse cx="685" cy="646.0" rx="8.8" ry="6.0"/><ellipse cx="672" cy="646.0" rx="4.4" ry="4.8"/><ellipse cx="749" cy="660.0" rx="9.6" ry="6.0"/><ellipse cx="735" cy="660.0" rx="4.8" ry="4.8"/>
      <ellipse cx="821" cy="648.0" rx="9.6" ry="6.0"/><ellipse cx="807" cy="648.0" rx="4.8" ry="4.8"/>
    </g>

    <!-- The piano, against the right wall, and the torch on its lid (evidence) -->
    <polygon points="880,470 1080,470 1110,452 910,452" fill="#5a3d2a"/>
    <rect x="880" y="470" width="200" height="190" fill="#7a5236"/>
    <rect x="890" y="560" width="180" height="22" fill="#fbfaf6"/>
    <g stroke-width="2"><line x1="910" y1="560" x2="910" y2="582"/><line x1="930" y1="560" x2="930" y2="582"/><line x1="950" y1="560" x2="950" y2="582"/><line x1="970" y1="560" x2="970" y2="582"/><line x1="990" y1="560" x2="990" y2="582"/><line x1="1010" y1="560" x2="1010" y2="582"/><line x1="1030" y1="560" x2="1030" y2="582"/><line x1="1050" y1="560" x2="1050" y2="582"/></g>
    <rect x="896" y="490" width="168" height="54" fill="#d0a65a"/>
    <!-- torch, lying on the lid -->
    <rect x="950" y="440" width="58" height="16" rx="6" fill="#5d7187"/>
    <rect x="1004" y="436" width="16" height="24" rx="4" fill="#d0a65a"/>
    <!-- cup, ordinary -->
    <path d="M1040,446 L1060,446 L1057,428 L1043,428 Z" fill="#fbfaf6"/>

    <!-- Chairs, back row -->
    <use href="#chair" x="380" y="720"/>
    <use href="#chair" x="500" y="720"/>
    <use href="#chair" x="620" y="720"/>
    <!-- 1 chair turned side on, to face the window (evidence) -->
    <g transform="translate(744 720)">
      <path d="M-30,-96 L-24,-96 L-22,-44 L-28,-44 Z" fill="#7d93a8"/>
      <path d="M-28,-48 L32,-48 L32,-38 L-28,-38 Z" fill="#6c8197"/>
      <path d="M-26,-96 L-26,-40 M-24,-38 L22,0 M22,-38 L-20,0" fill="none"/>
    </g>
    <!-- Chairs, front row, larger -->
    <g transform="translate(300 860) scale(1.3)"><use href="#chair"/></g>
    <g transform="translate(470 860) scale(1.3)"><use href="#chair"/></g>
    <g transform="translate(640 860) scale(1.3)"><use href="#chair"/></g>
    <g transform="translate(810 860) scale(1.3)"><use href="#chair"/></g>
    <!-- A coat over 1 back, hymn books on a seat: ordinary -->
    <path d="M440,738 C450,700 494,700 504,738 L496,790 L448,790 Z" fill="#8fa37e" transform="translate(30 0)"/>
    <rect x="610" y="780" width="58" height="12" fill="#b5573c"/>
    <rect x="614" y="768" width="52" height="12" fill="#5d7187"/>

    <!-- A key with no tag, under a front chair (evidence) -->
    <g transform="translate(560 868) rotate(-18)">
      <circle cx="0" cy="0" r="9" fill="#d0a65a"/>
      <circle cx="0" cy="0" r="3" fill="#d6be96"/>
      <path d="M9,0 L36,0 M28,0 L28,8 M34,0 L34,6" fill="none"/>
    </g>

    <!-- Bucket and mop by the left wall: ordinary -->
    <path d="M80,800 L140,800 L132,866 L88,866 Z" fill="#7d93a8"/>
    <path d="M78,800 C88,780 132,780 142,800" fill="none"/>
    <line x1="120" y1="806" x2="176" y2="640"/>
    <path d="M110,806 L130,806 L136,830 L104,830 Z" fill="#e3d6bd"/>
  </g>
</svg>
</body>
</html>
